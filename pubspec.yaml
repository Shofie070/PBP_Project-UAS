name: urban_wear_app
description: Aplikasi Urban Wear - Project Akhir PBP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLOC / CUBIT
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  meta: ^1.11.0

  # UI & UTILITIES
  getwidget: ^7.0.0
  intl: ^0.18.1
  shared_preferences: ^2.5.3
  lottie: ^3.1.0
  cupertino_icons: ^1.0.2
  sizer: ^2.0.15
  go_router: ^13.0.0
  flutter_rating_bar: ^4.0.0

  # NETWORK & LAUNCHER
  dio: ^5.9.0
  url_launcher: ^6.3.2
  device_info_plus: ^12.2.0
  webview_flutter: ^4.13.0
  permission_handler: ^12.0.1
  image_picker: ^1.2.1
  equatable: ^2.0.7
  font_awesome_flutter: ^10.12.0
  uuid: ^4.2.1
  http: ^1.1.0
  add_to_cart_animation: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Pastikan "assets:" menjorok 2 spasi
  assets:
    - assets/images/
    - assets/images/bg2.jpg   # tambahin kalau ada background
    - assets/images/FOTO KUU.jpg
    - assets/images/tshirt_icon.jpg
    - assets/json/person1.json

