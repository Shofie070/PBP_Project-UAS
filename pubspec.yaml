name: urban_wear_app
description: Aplikasi Urban Wear - Project Akhir PBP
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLOC / CUBIT
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  meta: ^1.11.0

  # UI & UTILITIES
  getwidget: ^7.0.0
  intl: ^0.18.1
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.2
  sizer: ^2.0.15
  go_router: ^13.0.0

  # NETWORK & LAUNCHER
  dio: ^5.9.0
  url_launcher: ^6.1.10
  device_info_plus: ^12.2.0
  webview_flutter: ^4.13.0
  permission_handler: ^12.0.1
  image_picker: ^1.2.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true   # WAJIB TRUE — getwidget butuh ini!
  
  assets:
    - assets/images/
    - assets/images/background.png   # tambahin kalau ada background
    # tambahin asset lain kalau perlu

  # fonts: (kalau pake custom font, tambahin di sini nanti)
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf